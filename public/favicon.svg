<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <rect width="64" height="64" rx="14" fill="#141417"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2b2b30" stroke-width="1.5" shape-rendering="auto"/>

  <!-- T tetromino, 13px blocks on a 15px pitch (2px gaps). Three blocks across
       the crossbar plus one stem — each a different piece color from the game. -->
  <rect x="11" y="15" width="13" height="13" fill="#5fb8bf"/>
  <rect x="26" y="15" width="13" height="13" fill="#a98cbf"/>
  <rect x="41" y="15" width="13" height="13" fill="#bf9a5f"/>
  <rect x="26" y="30" width="13" height="13" fill="#7fbf7f"/>
</svg>